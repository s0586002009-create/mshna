name: mishnah_tracker
description: אפליקציית מעקב לימוד משנה אישית, אופליין מלא.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  fl_chart: ^1.1.1
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^12.0.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  image: ^4.5.4
  file_picker: ^10.3.3
  flutter_launcher_icons: ^0.14.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/mishnah.json
    - assets/icon/icon.svg
    - assets/icon/icon.png
  fonts:
    - family: DejaVuSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: '#F4EBDD'
  adaptive_icon_foreground: assets/icon/icon.png
  min_sdk_android: 23