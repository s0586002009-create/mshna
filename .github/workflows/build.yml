name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Prepare embedded font and launcher PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig imagemagick
          chmod +x tool/prepare_assets.sh
          tool/prepare_assets.sh
      - name: Ensure platform files
        run: flutter create --overwrite --platforms=android,ios --project-name mishnah_tracker .
      - name: Configure Android core library desugaring
        run: |
          cat >> android/app/build.gradle <<'EOF'
          android {
            compileOptions {
              coreLibraryDesugaringEnabled true
            }
          }
          dependencies {
            coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
          }
          EOF
      - name: Dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mishnah-tracker-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
